plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
	id "com.matthewprenger.cursegradle" version "1.4.0"
}

version = project.mod_version
group = project.maven_group

def ENV = System.getenv()

base {
	archivesName = project.archives_base_name
}

repositories {

	mavenLocal()
	mavenCentral()

	exclusiveContent {

		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}

		filter {
			includeGroup "maven.modrinth"
		}
		
	}
	maven {
		name = "Ladysnake Mods (Releases)"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		name = "Ladysnake Mods (Snapshots)"
		url = "https://maven.ladysnake.org/snapshots"
	}
	maven {
		url = "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	maven {
		url = "https://maven.cafeteria.dev"
		content {
			includeGroup "net.adriantodt.fabricmc"
		}
	}
	maven {
		url = "https://maven.shedaniel.me"
	}
	maven {
		url = "https://maven.terraformersmc.com"
	}
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
	maven { url = "https://maven.bawnorton.com/releases" }
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//	Apoli
	include(modApi("io.github.apace100:apoli:${project.apoli_version}"))

	//	Cardinal Components
	modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	//	Cloth Config
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	//	Mod Menu
	modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	//	Reach Entity Attributes
	include(modApi("com.jamieswhiteshirt:reach-entity-attributes:${project.reach_version}"))

	// MixinSquared
	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixinsquared}")))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from ("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		mavenLocal()
		if (ENV.MAVEN_URL && ENV.MAVEN_USERNAME && ENV.MAVEN_PASSWORD) {
			maven {
				url = ENV.MAVEN_URL
				credentials {
					username = ENV.MAVEN_USERNAME
					password = ENV.MAVEN_PASSWORD
				}
			}
		}
	}
}

def addMarkerToJar(Task jarTask, String envType) {
	jarTask.from {
		def markerDir = file("$buildDir/tmp/${envType}Marker")
		markerDir.mkdirs()
		def markerFile = file("$markerDir/.cf_marker")
		markerFile.text = "CurseForge environment: ${envType}\nTimestamp: ${System.currentTimeMillis()}"
		return markerDir
	}
}

tasks.register("fabricJar", Jar) {
	dependsOn tasks.named("remapJar")
	from(zipTree(tasks.named("remapJar").get().archiveFile))
	addMarkerToJar(it, "fabric")
	destinationDirectory.set(file("$buildDir/libs/fabric"))
	archiveFileName.set(tasks.named("remapJar").get().archiveFileName.get())
}

tasks.register("forgeJar", Jar) {
	dependsOn tasks.named("remapJar")
	from(zipTree(tasks.named("remapJar").get().archiveFile))
	addMarkerToJar(it, "forge")
	destinationDirectory.set(file("$buildDir/libs/forge"))
	archiveFileName.set(tasks.named("remapJar").get().archiveFileName.get())
}

tasks.named("build").configure {
	dependsOn("fabricJar", "forgeJar")
}

def modVersion = project.findProperty("mod_version") ?: "dev"
def minecraftVersion = project.findProperty("minecraft_version") ?: "unknown"
def changelogText = file("changelog.md").exists() ? file("changelog.md").text : "No changelog provided."

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "origins"
	versionNumber = modVersion
	versionType = "release"
	changelog = changelogText
	gameVersions = [minecraftVersion]

	uploadFile = file("libs/forge/origins-forge-${modVersion}.jar")
	loaders = ["forge"]
	versionName = "${minecraftVersion}: Origins ${modVersion} [Forge]"

	dependencies {
		required.project "connector"
		required.project "connector-extras"
		required.project "forgified-fabric-api"
	}
}

tasks.register("publishModrinthFabric") {
	doLast {
		modrinth {
			token = System.getenv("MODRINTH_TOKEN")
			projectId = "origins"
			versionNumber = modVersion
			versionType = "release"
			changelog = changelogText
			gameVersions = [minecraftVersion]

			uploadFile = file("libs/fabric/origins-fabric-${modVersion}.jar")
			loaders = ["fabric"]
			versionName = "${minecraftVersion}: Origins ${modVersion} [Fabric]"

			dependencies {
				required.project "fabric-api"
				optional.project "modmenu"
				embedded.project "cloth-config"
				embedded.project "cardinal-components-api"
			}
		}
	}
}

curseforge {
	project {
		apiKey = System.getenv("CURSEFORGE_TOKEN")
		id = "origins"
		changelog = changelogText
		releaseType = "release"
		addGameVersion minecraftVersion

		mainArtifact(file("libs/fabric/Origins-${modVersion}.jar")) {
			displayName = "${minecraftVersion}: Origins ${modVersion} [Fabric]"
			relations {
				requiredDependency "fabric-api"
				embeddedLibrary "pal"
				embeddedLibrary "cloth-config"
				embeddedLibrary "cardinal-components-api"
			}
		}

		addArtifact(file("libs/forge/Origins-${modVersion}.jar")) {
			displayName = "${minecraftVersion}: Origins ${modVersion} [Forge]"
			relations {
				requiredDependency "sinytra-connector"
				requiredDependency "connector-extras"
				requiredDependency "forgified-fabric-api"
			}
		}
	}
}

tasks.register("publishAll") {
	dependsOn "modrinth", "publishModrinthFabric", "curseforge"
}